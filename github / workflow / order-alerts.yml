name: Order win alerts

on:
  schedule:
    # Every 5 min, Mon-Fri, 08:30-21:25 IST (cron is UTC: 03:00-15:55 UTC)
    - cron: "*/5 3-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit seen.json

concurrency:
  group: order-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check NSE/BSE and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts.py

      - name: Save seen state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen state" && git pull --rebase && git push)
